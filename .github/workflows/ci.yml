name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build engine (web depends on its types)
        run: pnpm --filter @revenant/engine build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, property and differential tests
        run: pnpm test
      - name: Build
        run: pnpm build
